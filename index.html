<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon site Docker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #3a3a5a);
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
        }

        h1 {
            margin-top: 30px;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Galerie */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .gallery img {
            width: 220px;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
        }

        .close, .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        .close {
            top: 20px;
            right: 40px;
            font-size: 50px;
        }

        .prev {
            left: 40px;
        }

        .next {
            right: 40px;
        }
    </style>
</head>

<body>

    <h1>Bienvenue sur mon site Docker</h1>
    <p>Voici mes images Docker :</p>

    <div class="gallery">
        <img src="images/photo1.png" onclick="openLightbox(0)">
        <img src="images/photo2.png" onclick="openLightbox(1)">
        <img src="images/photo3.png" onclick="openLightbox(2)">
        <img src="images/photo4.png" onclick="openLightbox(3)">
        <img src="images/photo5.png" onclick="openLightbox(4)">
        <img src="images/photo6.png" onclick="openLightbox(5)">
        <img src="images/photo7.png" onclick="openLightbox(6)">
        <img src="images/photo8.png" onclick="openLightbox(7)">
        <img src="images/photo9.png" onclick="openLightbox(8)">
        <img src="images/photo10.png" onclick="openLightbox(9)">
        <img src="images/photo11.png" onclick="openLightbox(10)">
        <img src="images/photo12.png" onclick="openLightbox(11)">
        <img src="images/photo13.png" onclick="openLightbox(12)">
        <img src="images/photo14.png" onclick="openLightbox(13)">
        <img src="images/photo15.png" onclick="openLightbox(14)">
        <img src="images/photo16.png" onclick="openLightbox(15)">
        <img src="images/photo17.png" onclick="openLightbox(16)">
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeLightbox()">×</span>
        <span class="prev" onclick="changeImage(-1)">❮</span>
        <img id="lightbox-img">
        <span class="next" onclick="changeImage(1)">❯</span>
    </div>

    <script>
        const images = [
            "images/photo1.png",
            "images/photo2.png",
            "images/photo3.png",
            "images/photo4.png",
            "images/photo5.png",
            "images/photo6.png",
            "images/photo7.png",
            "images/photo8.png",
            "images/photo9.png",
            "images/photo10.png",
            "images/photo11.png",
            "images/photo12.png",
            "images/photo13.png",
            "images/photo14.png",
            "images/photo15.png",
            "images/photo16.png",
            "images/photo17.png"
        ];

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            document.getElementById("lightbox-img").src = images[index];
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }

        function changeImage(direction) {
            currentIndex = (currentIndex + direction + images.length) % images.length;
            document.getElementById("lightbox-img").src = images[currentIndex];
        }
    </script>

</body>
</html>
